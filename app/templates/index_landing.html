<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="记一下" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=20261014-pwa4" />
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg?v=20261014-pwa4" />
  <link rel="manifest" href="/manifest.webmanifest?v=20261014-pwa4" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20261014-pwa4" />
  <title>记一下</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container compact-page">
    <header class="header capture-header center-header">
      <h1>记一下</h1>
      <p class="subtitle">先记下来，别打断自己。</p>
    </header>

    <section class="capture-box capture-box-focus landing-panel">
      <p class="landing-title">先选择你要进入的方式</p>
      <div class="landing-actions">
        <a href="/create-group" class="primary primary-big landing-button">新建组</a>
        <a href="/join" class="secondary-button primary-big landing-button">加入组</a>
      </div>
      <p class="hint landing-hint">新建组需要管理员批准，加入组需要组内设备批准。一个组内的设备会共享同一份记录。</p>
    </section>
    <section id="pwa-install-tip" class="hint-block" style="display:none; margin-top: -4px; margin-bottom: 16px;">
      <span id="pwa-install-text">把“记一下”装到手机桌面，打开更快、更像 App。</span>
      <button type="button" id="pwa-install-btn" class="subtle-link" style="display:none; margin-left: 8px; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer;">立即安装</button>
    </section>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function (err) {
          console.warn("service worker register failed", err);
        });
      });
    }
  </script>
  <script src="/static/pwa-install.js?v=20261014-pwa4"></script>
</body>
</html>
