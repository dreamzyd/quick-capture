<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接收自检</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=20261014-pwa6">
<link rel="manifest" href="/manifest.webmanifest?v=20261014-pwa6">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=20261014-pwa6">
<script src="/static/pwa-install.js?v=20261014-pwa6" defer></script>
<style>body{font-family:-apple-system,sans-serif;margin:16px;font-size:15px;line-height:1.6}</style>
</head>
<body>
<h1>接收自检</h1>
<p id="s">正在自检…</p>
<pre id="o" style="white-space:pre-wrap;word-break:break-all"></pre>
<script>
(function () {
  var bip = false;
  window.addEventListener("beforeinstallprompt", function () { bip = true; });
  function hash(s) { var h = 5381, i; for (i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; } return h.toString(36); }
  function send(why) {
    try {
      fetch("/pwa-diag", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ why: why.slice(0, 480), bip: bip, url: location.href }) });
    } catch (e) {}
  }
  function node(t, v) { document.getElementById("o").textContent += t + "=" + v + "\n"; }
  var link = document.querySelector("link[rel=manifest]");
  var mfURL = link ? link.href : "(none)";
  Promise.all([
    fetch(location.pathname + "?_n=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).catch(function (e) { return "ERR:" + e; }),
    fetch(mfURL + "&_n=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).catch(function (e) { return "ERR:" + e; })
  ]).then(function (res) {
    var h = res[0], m = res[1], mf = {};
    try { mf = JSON.parse(m); } catch (e) {}
    function has(s, x) { return s.indexOf(x) >= 0 ? 1 : 0; }
    var parts = [
      "recv",
      "docLen=" + document.documentElement.outerHTML.length,
      "netLen=" + h.length,
      "netHash=" + hash(h.slice(0, 4000)),
      "netHasMfLink=" + has(h, "manifest.webmanifest"),
      "netHasDiag=" + has(h, "pwa-install.js"),
      "mfURL=" + mfURL.replace(/^https:\/\//, ""),
      "mfLen=" + m.length,
      "mfId=" + (mf.id === undefined ? "-" : mf.id),
      "mfScope=" + (mf.scope === undefined ? "-" : mf.scope),
      "mfStart=" + (mf.start_url === undefined ? "-" : mf.start_url),
      "mfIcons=" + ((mf.icons || []).length),
      "mfHash=" + hash(m.slice(0, 2000)),
      "swCtrl=" + (navigator.serviceWorker && navigator.serviceWorker.controller ? 1 : 0),
      "cnt=" + (document.querySelectorAll("link[rel=manifest]").length)
    ].join("|");
    node("html", parts);
    node("bip", bip);
    document.getElementById("s").textContent = "已上报（可关闭本页）";
    send(parts);
    setTimeout(function () { send(parts + "|t15"); }, 15000);
  });
})();
</script>
</body>
</html>
